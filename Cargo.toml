[package]
name = "ruleman"
version = "0.1.0"
edition = "2024"
description = "A static analysis tool that checks repository files against a declarative rule config."
license = "MIT"
repository = "https://github.com/codebase-jp/ruleman"

[[bin]]
name = "ruleman"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
jsonc-parser = { version = "0.26", features = ["serde", "cst"] }
sha2 = "0.10"
ignore = "0.4.32"
globset = "0.4.19"
regex = "1.13.1"
yaml-rust2 = "0.11.0"
toml = "1.1.4"
